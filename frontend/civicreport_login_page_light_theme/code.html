<style>
        /* Custom Shadow mapping to Style Guidance Level 1 */
        .civic-glow-shadow {
            box-shadow: 0px 4px 20px rgba(15, 23, 42, 0.05);
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Optional: Subtle Background Accent for Light Airy Aesthetic -->
<div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-primary-fixed/30 to-transparent -z-10 pointer-events-none"></div>
<!-- Login Container -->
<div class="w-full max-w-[480px] z-10 flex flex-col items-center">
<!-- Header / Logo -->
<div class="flex flex-col items-center mb-8">
<div class="flex items-center gap-3 mb-6">
<div class="w-10 h-10 rounded-lg bg-primary text-on-primary flex items-center justify-center font-headline-sm text-headline-sm"><img src="https://lh3.googleusercontent.com/aida/AEtjO1WSejny5Njx9d_D-28NeLhbMg_XIaOr1NHt2ElgveUhML7Kd_aB4J7tjO5kc6StV_33X2BoD0gj9CPt4pkaArOQyuBs2eUvOwvzZjFi8UCioQOXo3jfYMpdmmoSq0JuNu4JKHlhEQpn4Tj5ADnz6ef_pRq5iuEtetFduKKVGMsQtz0-7U_c8j0HgxE3e2xGsAlPhRb7o9RKuqVAVxpLWxyIgm8FDGl76PbRDtwbenUybBq_-04pK69BTxep" alt="CivicReport Logo" class="w-full h-full rounded-lg object-cover"></div>
<h1 class="font-headline-md text-headline-md text-on-surface">CivicReport</h1>

</div>
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">
                Welcome Back
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                Sign in to track complaints and report neighborhood issues
            </p>
</div>
<!-- Main Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-6 md:p-8 border border-outline-variant/30 civic-glow-shadow">
<!-- Demo Account Action -->
<button class="w-full h-12 bg-primary-fixed text-on-primary-fixed-variant rounded-lg flex items-center justify-center gap-2 hover:bg-primary-fixed-dim transition-colors mb-6 group">
<span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">bolt</span>
<span class="font-label-md text-label-md">Continue with Demo Account</span>
</button>
<!-- Divider -->
<div class="flex items-center gap-4 mb-6">
<div class="flex-1 h-px bg-outline-variant/40"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-widest">or login with email</span>
<div class="flex-1 h-px bg-outline-variant/40"></div>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-5" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface uppercase" for="email">Citizen Email</label>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-transparent text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md placeholder:text-outline-variant" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface uppercase" for="password">Password</label>
</div>
<input class="w-full h-12 px-4 rounded-lg border border-outline-variant bg-transparent text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md text-body-md placeholder:text-outline-variant tracking-widest" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
<!-- Submit Action -->
<button class="w-full h-12 mt-2 bg-primary text-on-primary rounded-lg flex items-center justify-center gap-2 hover:bg-surface-tint transition-colors group" type="submit">
<span class="font-label-md text-label-md">Sign In to Dashboard</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_right_alt</span>
</button>
</form>
<!-- Create Account Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-semibold hover:underline decoration-primary/30 underline-offset-4 transition-all" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Return Link -->
<div class="mt-8">
<a class="flex items-center gap-2 font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">keyboard_backspace</span>
                Return to Homepage
            </a>
</div>
</div>


</body></html>
