<script>
        // Simple script to handle category selection state
        document.querySelectorAll('.grid button').forEach(button => {
            button.addEventListener('click', function() {
                // Reset all
                document.querySelectorAll('.grid button').forEach(btn => {
                    btn.classList.remove('ring-2', 'ring-primary', 'bg-surface-container-low');
                    btn.classList.add('bg-surface-container-lowest');
                });
                
                // Set active
                this.classList.add('ring-2', 'ring-primary', 'bg-surface-container-low');
                this.classList.remove('bg-surface-container-lowest');

                // Enable continue button
                const continueBtn = document.querySelector('button:disabled');
                if(continueBtn) {
                    continueBtn.disabled = false;
                    continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                }
            });
        });
